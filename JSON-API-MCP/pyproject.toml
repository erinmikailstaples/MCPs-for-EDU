[project]
name = "jeopardy-mcp-template"
version = "0.1.0"
description = "Part 1 reference template: JSON to FastAPI to MCP"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.118.0",
  "httpx==0.28.1",
  "mcp==2.3.0",
  "pydantic==2.12.3",
  "uvicorn==0.37.0",
]

[dependency-groups]
dev = [
  "pytest==8.4.2",
  "pytest-anyio==0.0.0",
  "ruff==0.13.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jeopardy_template"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
