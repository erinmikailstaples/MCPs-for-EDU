[project]
name = "product-context-mcp-template"
version = "0.1.0"
description = "Copyable MCP guide driven by your own product context"
requires-python = ">=3.12"
dependencies = ["mcp==2.3.0", "pydantic==2.12.3"]

[dependency-groups]
dev = ["pytest==8.4.2", "ruff==0.13.3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
